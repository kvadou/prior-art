name: Offline checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test skills/prior-art/bin/*.test.ts
      - name: Shell syntax
        run: for script in skills/prior-art/bin/*.sh; do bash -n "$script" || exit; done
      - name: Latest commit whitespace
        run: git show --format= --check HEAD
